<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surf Contest">
<title>Halloween Surf Contest</title>
<meta name="theme-color" content="#FFCF00">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@500;700&family=Poppins:wght@600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFCF00; --blue:#1266E8; --sky:#A1DBFF; --red:#FF1403; --green:#00614D; --coral:#F77D57; --pink:#FFC4D6;
  --paper:#fff; --ink:#000; --line:#000; --bg:#FFF6CC;
  --serif:'Source Serif 4','Source Serif Pro',Georgia,serif; --sans:Karla,system-ui,sans-serif; --pop:Poppins,Karla,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.35 var(--sans);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{user-select:none;-webkit-user-select:none}
h1,h2{font-family:var(--serif);font-weight:400;margin:0}
h3{font:700 15px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:0}
header{background:var(--paper);border-bottom:3px solid var(--line);box-shadow:0 8px 0 var(--yellow);padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo{height:84px;width:auto;display:block}
header h1{font-size:28px;line-height:1.1;flex:1;min-width:150px}
#status{font-size:15px;font-weight:700;width:100%}
#status b{background:var(--red);color:#fff;padding:1px 6px;border-radius:4px}
#status b.saving{background:var(--yellow);color:var(--ink);border:2px solid var(--line);padding:1px 8px}
body.busy main{opacity:.55;transition:opacity .15s}
body:not([data-view=board]) header{position:sticky;top:0;z-index:20;height:52px;padding:0 14px;flex-wrap:nowrap;gap:10px}
body:not([data-view=board]) header .logo{display:none}
body:not([data-view=board]) header h1{font-size:20px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body:not([data-view=board]) #status{width:auto;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:12px}
body[data-view=admin] main{padding-bottom:170px}
body[data-view=judge] main{padding-bottom:120px}
.view{display:none}.view.on{display:block}
.card{border:3px solid var(--line);border-radius:8px;padding:12px;margin:0 0 14px;background:var(--paper)}
.card.live{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue)}
.card h2{font-size:26px;margin-bottom:6px}
.sub{font-size:17px;color:#1a1a1a;margin:0 0 8px}
.muted{color:#333}
button,select,input[type=text],input[type=number]{font:inherit;font-size:18px;font-weight:700;border:3px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-height:52px;padding:8px 12px}
button{background:var(--blue);color:#fff;cursor:pointer}
button.alt{background:var(--paper);color:var(--ink)}
button.danger{background:var(--red);color:#fff}
button:disabled{background:#e3e3e3;color:#666;border-color:#777;cursor:not-allowed}
button.big{width:100%;min-height:64px;font-size:21px}
button.sm{min-height:44px;padding:4px 12px;font-size:17px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{border:3px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.sc .t{padding:10px}
.sc .t b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.15}
.sc .t span{font-size:16px;color:#1a1a1a}
.judgecard{border:3px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden;background:var(--paper)}
.judgecard .lab{font:600 34px/1.1 var(--serif);padding:14px 12px 4px}
.judgecard .nm{padding:0 12px 12px;font-size:18px;color:#1a1a1a}
.stepper{display:flex;align-items:stretch;border-top:3px solid var(--line)}
.stepper button{width:84px;min-height:76px;font-size:38px;border:0;border-radius:0;line-height:1}
.stepper .val{flex:1;display:flex;align-items:center;justify-content:center;font:600 48px var(--serif);border-left:3px solid var(--line);border-right:3px solid var(--line)}
.stepper .val.empty{color:#777}
.pick{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pick button{flex:1;min-height:60px;font-size:24px;background:var(--paper);color:var(--ink)}
.pick button.on{background:var(--blue);color:#fff}
.badge{display:inline-block;border:2px solid var(--line);border-radius:20px;padding:3px 12px;font:600 14px/1.3 var(--pop);letter-spacing:.08em;text-transform:uppercase;background:var(--paper)}
.badge.ok{background:var(--green);color:#fff;border-color:var(--green)}
.badge.warn{background:var(--yellow)}
.badge.bad{background:var(--red);color:#fff;border-color:var(--red)}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:2px solid #ddd}
.item:first-child{border-top:0}
.item .grow b{display:block;line-height:1.15}
.item .grow span{font-size:16px;color:#1a1a1a}
.podium .item{border-top:0}
.rank{font:600 24px var(--serif);width:34px;text-align:center}
.note{background:var(--sky);border:2px solid var(--blue);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:16px}
.err{background:var(--pink);border-color:var(--red)}
label.chk{display:flex;align-items:center;gap:10px;min-height:52px;font-size:18px;font-weight:700}
label.chk input{width:30px;height:30px;flex:none}
.form #f-age{flex:0 0 96px;width:96px}
.form #f-div{padding-left:8px;padding-right:4px}
.form .row{margin-bottom:10px}
.form input[type=text],.form input[type=number],.form select{width:100%}
a{color:var(--ink);font-weight:700;text-decoration:underline}
footer{text-align:center;padding:10px 0 30px;font-size:17px}

.heatbar{position:sticky;top:52px;z-index:15;background:var(--blue);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;margin:0 -12px 12px;border-top:3px solid var(--line);border-bottom:3px solid var(--line)}
.heatbar b{display:block;font:600 20px/1.1 var(--serif)}
.heatbar span{font-size:16px}
.judgecard.done{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.judgebar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:3px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));align-items:center;gap:12px}
.judgebar .info{flex:1;min-width:0;line-height:1.2}
.judgebar .info b{display:block;font-size:19px}
.judgebar .info span{font-size:15px;color:#1a1a1a}
.judgebar button{min-width:140px;min-height:56px;font-size:20px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:3px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body[data-view=admin] .tabbar{display:flex}
.tabbar>*{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:0;background:var(--paper);color:var(--ink);font:700 16px var(--sans);text-decoration:none;padding:4px}
.tabbar>*+*{border-left:2px solid var(--line)}
.tabbar .on{background:var(--yellow)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fab{display:none;position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:25;min-height:60px;border-radius:30px;padding:0 22px;font-size:20px;box-shadow:0 4px 0 var(--line)}
body[data-view=admin][data-tab=checkin] .fab{display:flex;align-items:center;gap:8px}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:92dvh;overflow-y:auto;background:var(--paper);border:3px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet .panel h2{font-size:24px;margin:0}
.toast{position:fixed;left:50%;top:62px;transform:translate(-50%,-16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){.sheet.open .panel{animation:up .18s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
</style>
</head>

    <label class="chk" id="f-ccwrap"><input type="checkbox" id="f-cc"> Also in beach costume contest</label>
    <div class="row"><button class="grow big" id="f-save" data-act="save">Add surfer</button></div>
    <div class="row"><button class="danger sm" id="f-del" data-act="delsurfer" style="display:none">Delete entry</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
// ---------- Config ----------
// Paste your Apps Script web app URL here. Leave empty to try the app in demo mode.
const API_URL = 'https://script.google.com/macros/s/AKfycbxpJ-DdcGn7OyaQ_GObjoWAteYO1hpC8Rtok_9NTLOwSKPeM3K0Gh0-9hN31WRcUKzY/exec';

const COSTUME = 'Costume only';
const DIVS = [
  { name: 'Tiny Terrors', fee: 20 },
  { name: 'Grom Reapers', fee: 30 },
  { name: 'Monster Mash', fee: 40 }
];
const suggestDiv = a => a <= 12 ? DIVS[0].name : a <= 17 ? DIVS[1].name : DIVS[2].name;
const feeForAge = a => (a === '' || a == null) ? 0 : a <= 12 ? 20 : a <= 17 ? 30 : 40;
const feeOf = s => s.division === COSTUME ? 0 : feeForAge(s.age);

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = (k, d) => { try { const v = localStorage.getItem('sc_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('sc_' + k, JSON.stringify(v)); } catch (e) {} };
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const bool = v => v === true || v === 'TRUE' || v === 'true';
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const money = n => '$' + n;

// ---------- State ----------
let S = { surfers: [], heats: [], scores: [], config: {} };
let lastJSON = '', dirty = false, queue = ls('queue', []), online = null;

function norm(raw) {
  return {
    surfers: (raw.surfers || []).map(s => ({
      id: String(s.id), name: String(s.name || ''), age: s.age === '' ? '' : Number(s.age),
      division: String(s.division || ''), costume: String(s.costume || ''),
      paid: bool(s.paid), costumeContest: bool(s.costumeContest)
    })),
    heats: (raw.heats || []).map(h => ({
      id: String(h.id), division: String(h.division), round: Number(h.round), num: Number(h.num),
      final: bool(h.final), surfers: String(h.surfers || '').split(',').filter(Boolean),
      status: String(h.status || 'upcoming'), startedAt: Number(h.startedAt) || 0,
      override: String(h.override || '').split(',').filter(Boolean)
    })),
    scores: (raw.scores || []).map(x => ({
      id: String(x.id), heatId: String(x.heatId), judge: Number(x.judge), surferId: String(x.surferId), value: Number(x.value)
    })),
    config: raw.config || {}
  };
}

function setState(raw) {
  const j = JSON.stringify(raw);
  if (j === lastJSON) return;
  lastJSON = j;
  S = norm(raw);
  if (editing()) dirty = true; else render();
}
function editing() {
  const a = document.activeElement;
  return !!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.closest('.dyn'));
}
document.addEventListener('focusout', () => setTimeout(() => { if (dirty && !editing()) { dirty = false; render(); } }, 250));

// ---------- Backend (Apps Script, or localStorage demo) ----------
function demoRead() { return ls('demo', { surfers: [], heats: [], scores: [], config: {} }); }
function demoApply(ops) {
  const db = demoRead();
  const tabs = { Surfers: 'surfers', Heats: 'heats', Scores: 'scores' };
  ops.forEach(op => {
    if (op.t === 'upsert') {
      if (op.tab === 'Config') { db.config[op.row.id] = op.row.value; return; }
      const list = db[tabs[op.tab]];
      const i = list.findIndex(r => String(r.id) === String(op.row.id));
      if (i >= 0) Object.assign(list[i], op.row); else list.push(Object.assign({}, op.row));
    } else if (op.t === 'delete') {
      db[tabs[op.tab]] = db[tabs[op.tab]].filter(r => String(r.id) !== String(op.id));
    }
  });
  lsSet('demo', db);
  return db;
}

// writeSeq changes at the start and end of every write, so a poll that began before a write
// finished is discarded instead of overwriting fresher data with a stale snapshot.
let writeSeq = 0;
async function call(ops) {
  writeSeq++;
  try {
    let res;
    if (!API_URL) res = demoApply(ops);
    else {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin: ls('pin', ''), ops }) });
      res = await r.json();
    }
    if (res.error) throw new Error(res.error);
    setState(res);
    setOnline(true);
    return res;
  } finally { writeSeq++; }
}
async function poll() {
  const seq = writeSeq;
  try {
    const r = API_URL ? await (await fetch(API_URL)).json() : demoRead();
    if (r.error) throw new Error(r.error);
    if (seq !== writeSeq || busy) return;
    setState(r); setOnline(true);
  } catch (e) { setOnline(false, e.message); }
}
let lastErr = '';
function setOnline(v, err) { online = v; lastErr = v ? '' : (err || lastErr); renderStatus(); }

let toastT;
function toast(m) {
  const el = $('#toast'); el.textContent = m; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200);
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function openSheet(focus) {
  $('#sheet').classList.add('open'); document.body.classList.add('noscroll');
  if (focus) setTimeout(() => $('#f-costume').focus(), 60);
}
function closeSheet() { $('#sheet').classList.remove('open'); document.body.classList.remove('noscroll'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { formReset(); closeSheet(); } });

// One admin write at a time. Apps Script can take a few seconds, and a second tap
// during that wait used to create duplicate heats.
let busy = 0;
function setBusy(delta) { busy += delta; document.body.classList.toggle('busy', busy > 0); renderStatus(); }
async function act(fn, msg) {
  if (busy) { toast('Still saving. Wait a second.'); return false; }
  setBusy(1);
  try {
    await fn();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    dirty = false; render();
    if (msg) toast(msg);
    return true;
  } catch (e) {
    if (/PIN/.test(e.message)) { localStorage.removeItem('sc_pin'); alert('Wrong PIN. Reload and try again.'); }
    else alert('Not saved. Check your signal and try again.\n(' + e.message + ')');
    return false;
  } finally { setBusy(-1); }
}

// Judge scores go through an offline queue so a dead zone doesn't lose them.
let flushing = false;
function enqueue(ops) { queue.push(ops); lsSet('queue', queue); flush(); renderStatus(); }
async function flush() {
  if (flushing || !queue.length) return;
  flushing = true;
  try {
    while (queue.length) { await call(queue[0]); queue.shift(); lsSet('queue', queue); }
  } catch (e) { setOnline(false); }
  flushing = false;
  renderStatus(); if (view() === 'judge') renderJudge();
}
const pendingFor = hid => queue.some(b => b.some(o => o.row && o.row.heatId === hid));

// ---------- Domain helpers ----------
const sById = id => S.surfers.find(s => s.id === id);
const heatsOf = d => S.heats.filter(h => h.division === d);
const byOrder = (a, b) => a.round - b.round || divIdx(a.division) - divIdx(b.division) || a.num - b.num;
const divIdx = d => { const i = DIVS.findIndex(x => x.name === d); return i < 0 ? 99 : i; };
const divList = () => {
  const extra = [...new Set(S.surfers.map(s => s.division))].filter(d => d && d !== COSTUME && divIdx(d) === 99);
  return DIVS.map(d => d.name).concat(extra);
};
const liveHeat = () => S.heats.filter(h => h.status === 'live').sort((a, b) => b.startedAt - a.startedAt)[0];
const judgesN = () => Number(S.config.judges) || 3;
function label(h) {
  const sib = S.heats.filter(x => x.division === h.division && x.round === h.round);
  return { title: h.division, sub: (h.final ? 'Final' : 'Round ' + h.round) + (sib.length > 1 ? ', Heat ' + h.num : '') };
}
const fullLabel = h => { const l = label(h); return l.title + ', ' + l.sub; };
const adv = h => h.surfers.length <= 1 ? h.surfers.length : Math.min(2, h.surfers.length - 1);
const mean = a => a && a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 100) / 100 : null;
function scoreMap(hid) {
  const m = {};
  S.scores.filter(x => x.heatId === hid).forEach(x => { (m[x.surferId] = m[x.surferId] || []).push(x.value); });
  return m;
}
function ranking(h) {
  const m = scoreMap(h.id);
  let rows = h.surfers.map(id => ({ id, avg: mean(m[id]) }));
  const ov = h.override;
  let overridden = false;
  if (ov.length && ov.length === h.surfers.length && ov.every(i => h.surfers.includes(i))) {
    rows = ov.map(id => rows.find(r => r.id === id)); overridden = true;
  } else rows.sort((a, b) => (b.avg == null ? -1 : b.avg) - (a.avg == null ? -1 : a.avg));
  const top = h.final ? 4 : adv(h) + 1;
  rows.ties = !overridden && rows.some((r, i) => i > 0 && i < top && r.avg != null && r.avg === rows[i - 1].avg);
  return rows;
}
const judgeDone = (h, j) => h.surfers.length > 0 && h.surfers.every(id => S.scores.some(x => x.heatId === h.id && x.judge === j && x.surferId === id));

// ---------- UI atoms ----------
const costumeOf = s => s ? (s.costume || s.name || '(no label)') : '(removed)';
function surferCard(s) {
  if (!s) return '';
  return `<div class="sc">
    <div class="t"><b>${esc(costumeOf(s))}</b><span>${esc(s.name)}</span></div></div>`;
}
function renderStatus() {
  const n = queue.reduce((a, b) => a + b.length, 0);
  if (busy) { $('#status').innerHTML = '<b class="saving">Saving...</b>'; return; }
  $('#status').innerHTML = (online === null ? 'Connecting...' : online ? 'Connected' : '<b>Offline</b>' + (lastErr ? ' (' + esc(lastErr) + ')' : '')) + (n ? ` - <b>${n} pending</b>` : '');
}

// ---------- Views ----------
const view = () => (location.hash.slice(1) || 'board');
let adminTab = ls('adminTab', 'checkin');

function render() {
  const v = view();
  ['board', 'judge', 'admin'].forEach(n => $('#v-' + n).classList.toggle('on', n === v));
  document.body.dataset.view = v; document.body.dataset.tab = adminTab;
  if (v !== 'judge') $('#judgebar').style.display = 'none';
  if (v === 'board') renderBoard();
  else if (v === 'judge') renderJudge();
  else if (v === 'admin') {
    $('#p-checkin').style.display = adminTab === 'checkin' ? '' : 'none';
    $('#p-run').style.display = adminTab === 'run' ? '' : 'none';
    $('#t-checkin').classList.toggle('on', adminTab === 'checkin');
    $('#t-run').classList.toggle('on', adminTab === 'run');
    refreshDivSelect();
    renderRoster(); renderRun();
  }
  renderStatus();
}

// Public board
function renderBoard() {
  let h = '';
  const live = liveHeat();
  if (live) {
    const l = label(live);
    h += `<div class="card live"><h2>${esc(l.title)}</h2><p class="sub">${esc(l.sub)}, in the water now</p>
      <div class="grid">${live.surfers.map(id => surferCard(sById(id))).join('')}</div></div>`;
  } else h += '<div class="card"><h2>No heat in the water</h2><p class="sub">Next heat starts soon.</p></div>';

  const up = S.heats.filter(x => x.status === 'upcoming').sort(byOrder).slice(0, 3);
  if (up.length) {
    h += '<div class="card"><h2>Up next</h2>';
    up.forEach(x => {
      const l = label(x);
      h += `<p class="sub" style="margin-top:10px"><b>${esc(l.title)}, ${esc(l.sub)}</b></p>
        ${x.surfers.map(id => { const s = sById(id); return `<div class="item"><div class="grow"><b>${esc(costumeOf(s))}</b><span>${esc(s ? s.name : '')}</span></div></div>`; }).join('')}`;
    });
    h += '</div>';
  }

  divList().forEach(d => {
    const hs = heatsOf(d).sort(byOrder);
    const closed = hs.filter(x => x.status === 'closed');
    if (!closed.length) return;
    const fin = closed.find(x => x.final);
    h += `<div class="card"><h2>${esc(d)}</h2>`;
    if (fin) h += podium(fin);
    else closed.forEach(x => {
      const r = ranking(x).slice(0, adv(x));
      h += `<p class="sub"><b>${esc(label(x).sub)} advancing:</b> ${r.map(y => esc(costumeOf(sById(y.id)))).join(', ')}</p>`;
    });
    h += '</div>';
  });

  const cats = costumeCats().filter(c => S.config[c[0]]);
  if (cats.length) {
    h += '<div class="card"><h2>Costume contest winners</h2>';
    cats.forEach(c => { const s = sById(String(S.config[c[0]])); h += `<div class="item"><div class="grow"><b>${esc(costumeOf(s))}</b><span>${esc(c[1])}${s && s.name ? ', ' + esc(s.name) : ''}</span></div></div>`; });
    h += '</div>';
  }
  $('#board').innerHTML = h;
}
const medals = ['🥇', '🥈', '🥉'];
function podium(fin) {
  const r = ranking(fin).slice(0, 3);
  return '<div class="podium">' + r.map((x, i) => { const s = sById(x.id); return `<div class="item"><div class="rank">${medals[i]}</div><div class="grow"><b>${esc(costumeOf(s))}</b><span>${esc(s ? s.name : '')}${x.avg != null ? ', ' + x.avg : ''}</span></div></div>`; }).join('') + '</div>' +
    (ranking(fin).ties ? '<div class="note">Tie. Admin is deciding.</div>' : '');
}
const costumeCats = () => [['bestOverall', 'Best overall costume'], ['mostCreative', 'Most creative costume'], ['bestGroup', 'Best group costume']];

// Judge
function renderJudge() {
  const J = judgesN();
  const me = ls('judge', 0);
  const bar = $('#judgebar'); bar.style.display = 'none';
  let h = `<div class="pick"><span><b>Judge</b></span>${Array.from({ length: J }, (_, i) => `<button class="${me === i + 1 ? 'on' : ''}" data-act="judge" data-n="${i + 1}">${i + 1}</button>`).join('')}</div>`;
  if (!me) { $('#judge').innerHTML = h + '<p>Tap your judge number.</p>'; return; }
  const live = liveHeat();
  if (!live) {
    const nx = S.heats.filter(x => x.status === 'upcoming').sort(byOrder)[0];
    h += '<div class="card"><h2>Waiting for the next heat</h2><p class="sub">Scoring opens when the heat is started.</p>' + (nx ? `<p class="sub"><b>Up next:</b> ${esc(fullLabel(nx))}</p>` : '') + '</div>';
    $('#judge').innerHTML = h; return;
  }
  const l = label(live);
  const drafts = ls('draft', {});
  h += `<div class="heatbar"><div><b>${esc(l.title)}</b><span>${esc(l.sub)}</span></div><div class="badge bad">Live</div></div>`;
  let scored = 0, synced = true;
  live.surfers.forEach(id => {
    const s = sById(id), k = live.id + '|' + me + '|' + id;
    const saved = S.scores.find(x => x.id === k);
    const v = k in drafts ? drafts[k] : (saved ? saved.value : null);
    if (v != null) scored++;
    if (!saved || saved.value !== v) synced = false;
    h += `<div class="judgecard ${v != null ? 'done' : ''}">
      <div class="lab">${esc(costumeOf(s))}</div><div class="nm">${esc(s ? s.name : '')}</div>
      <div class="stepper"><button data-act="step" data-k="${esc(k)}" data-d="-0.5" aria-label="Lower score">−</button>
      <div class="val ${v == null ? 'empty' : ''}">${v == null ? '–' : v.toFixed(1)}</div>
      <button data-act="step" data-k="${esc(k)}" data-d="0.5" aria-label="Raise score">+</button></div></div>`;
  });
  const total = live.surfers.length, all = total > 0 && scored === total, pend = pendingFor(live.id);
  bar.innerHTML = `<div class="info"><b>${scored} of ${total} scored</b><span>${pend ? 'Pending. Sends when signal returns' : synced ? 'Sent. Change a score to resubmit' : all ? 'Ready to submit' : 'Score every surfer'}</span></div>
    <button data-act="submit" ${all && !synced ? '' : 'disabled'}>${synced ? 'Sent' : 'Submit'}</button>`;
  bar.style.display = 'flex';
  $('#judge').innerHTML = h;
}

// Check-in form + roster
function refreshDivSelect() {
  const sel = $('#f-div');
  if (sel.options.length) return;
  sel.innerHTML = DIVS.map(d => `<option>${esc(d.name)}</option>`).join('') + `<option>${COSTUME}</option>`;
}
let divTouched = false;
function formReset() {
  ['f-id', 'f-name', 'f-costume', 'f-age'].forEach(i => $('#' + i).value = '');
  $('#f-paid').checked = false; $('#f-cc').checked = false;
  $('#f-div').selectedIndex = 0; divTouched = false;
  $('#f-title').textContent = 'Add entry'; $('#f-save').textContent = 'Add surfer';
  $('#f-del').style.display = 'none';
  syncCC();
}
function syncCC() { $('#f-ccwrap').style.display = $('#f-div').value === COSTUME ? 'none' : ''; }
function formEdit(id) {
  const s = sById(id); if (!s) return;
  refreshDivSelect();
  $('#f-id').value = s.id; $('#f-name').value = s.name; $('#f-costume').value = s.costume;
  $('#f-age').value = s.age; $('#f-div').value = s.division; divTouched = true;
  $('#f-paid').checked = s.paid; $('#f-cc').checked = s.costumeContest;
  $('#f-title').textContent = 'Edit entry'; $('#f-save').textContent = 'Save changes';
  $('#f-del').style.display = '';
  syncCC(); openSheet(false);
}
async function saveSurfer() {
  const costume = $('#f-costume').value.trim(), name = $('#f-name').value.trim();
  const division = $('#f-div').value, ageRaw = $('#f-age').value;
  if (!costume) return alert('Add a costume label. Judges identify surfers by it.');
  if (!name) return alert('Add a name.');
  if (division !== COSTUME && ageRaw === '') return alert('Add an age, or pick Costume only.');
  const editId = $('#f-id').value, id = editId || uid('s');
  const dup = S.surfers.find(x => x.id !== editId && x.costume.trim().toLowerCase() === costume.toLowerCase());
  if (dup && !confirm('Another entry already uses "' + costume + '". Judges tell surfers apart by this label. Add it anyway?')) return;
  const row = { id, name, age: ageRaw === '' ? '' : Number(ageRaw), division, costume, paid: $('#f-paid').checked, costumeContest: division === COSTUME ? true : $('#f-cc').checked };
  const ops = [{ t: 'upsert', tab: 'Surfers', row }];
  const ok = await act(() => call(ops), editId ? 'Saved' : 'Added: ' + costume);
  if (!ok) return;
  formReset();
  if (editId) closeSheet(); else $('#f-costume').focus();
}
function renderRoster() {
  const all = S.surfers;
  const paid = all.filter(s => s.paid), owed = all.reduce((a, s) => a + feeOf(s), 0), got = paid.reduce((a, s) => a + feeOf(s), 0);
  let h = `<div class="card"><h2>${all.length} entries</h2><p class="sub">Collected ${money(got)} of ${money(owed)}. Unpaid: ${all.length - paid.length}.</p>`;
  divList().concat([COSTUME]).forEach(d => {
    const l = all.filter(s => s.division === d);
    if (!l.length) return;
    const dg = l.filter(s => s.paid).reduce((a, s) => a + feeOf(s), 0);
    h += `<h3 style="margin-top:14px">${esc(d)} (${l.length}${d !== COSTUME ? ', ' + money(dg) : ''})</h3>` +
      l.map(s => `<div class="item"><div class="grow"><b>${esc(costumeOf(s))}</b><span>${esc(s.name)}${s.age !== '' ? ', ' + s.age : ''}${s.costumeContest && d !== COSTUME ? ', costume contest' : ''}</span></div>
        <button class="sm ${s.paid ? '' : 'alt'}" data-act="paid" data-id="${esc(s.id)}">${s.paid ? 'Paid' : 'Unpaid'}</button>
        <button class="sm alt" data-act="edit" data-id="${esc(s.id)}">Edit</button></div>`).join('');
  });
  if (!all.length) h += '<p class="sub">No entries yet. Add the first one above.</p>';
  $('#roster').innerHTML = h + '</div>';
}

// Run of show
function renderRun() {
  const J = judgesN();
  let h = S.heats.filter(x => x.status === 'live').map(x => `<div class="card live"><h2>${esc(label(x).title)}</h2><p class="sub">Now in the water</p>${heatCard(x, [], J)}</div>`).join('');
  divList().forEach(d => {
    const hs = heatsOf(d).sort(byOrder);
    const n = S.surfers.filter(s => s.division === d).length;
    h += `<div class="card"><h2>${esc(d)}</h2><p class="sub">${n} surfers</p>`;
    if (!hs.length) h += n ? `<button class="big" data-act="gen" data-d="${esc(d)}">Make round 1 heats</button>` : '<p class="sub">No entries yet.</p>';
    else {
      const upcoming = hs.filter(x => x.status === 'upcoming');
      const inR1 = new Set(hs.filter(x => x.round === 1).flatMap(x => x.surfers));
      const un = S.surfers.filter(s => s.division === d && !inR1.has(s.id));
      if (un.length) {
        h += '<div class="note"><b>Not in a heat yet</b>' + un.map(s => `<div class="item"><div class="grow"><b>${esc(costumeOf(s))}</b></div>
          ${upcoming.length ? `<select data-chg="assign" data-s="${esc(s.id)}"><option value="">Add to...</option>${upcoming.map(u => `<option value="${esc(u.id)}">${esc(label(u).sub)}</option>`).join('')}</select>` : '<span>No upcoming heat</span>'}</div>`).join('') + '</div>';
      }
      hs.forEach(x => { if (x.status !== 'live') h += heatCard(x, upcoming, J); });
      const last = Math.max(...hs.map(x => x.round)), lh = hs.filter(x => x.round === last);
      if (lh.every(x => x.status === 'closed') && !lh.some(x => x.final))
        h += `<button class="big" data-act="gen" data-d="${esc(d)}">Make round ${last + 1} heats</button>`;
    }
    h += '</div>';
  });

  // Costume contest winners
  const entrants = S.surfers.filter(s => s.costumeContest || s.division === COSTUME);
  h += '<div class="card"><h2>Costume contest winners</h2>' + costumeCats().map(c => `<div class="row" style="margin-bottom:8px"><span class="grow"><b>${c[1]}</b></span>
    <select data-chg="winner" data-k="${c[0]}" style="max-width:60%"><option value="">Not chosen</option>${entrants.map(s => `<option value="${esc(s.id)}" ${String(S.config[c[0]] || '') === s.id ? 'selected' : ''}>${esc(costumeOf(s))}</option>`).join('')}</select></div>`).join('') + '</div>';

  // Settings
  h += `<div class="card"><h2>Settings</h2>
    <div class="row" style="margin-bottom:10px"><span class="grow"><b>Number of judges</b></span>
    <select data-chg="judges">${[1, 2, 3, 4, 5].map(n => `<option ${n === J ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <p class="sub"><b>Merge divisions</b> (use when one has fewer than 3 entries)</p>
    <div class="row"><select id="m-from" class="grow">${divList().map(d => `<option>${esc(d)}</option>`).join('')}</select>
    <span>into</span><select id="m-to" class="grow">${divList().map(d => `<option>${esc(d)}</option>`).join('')}</select>
    <button class="alt" data-act="merge">Merge</button></div></div>`;
  $('#run').innerHTML = h;
}

function heatCard(x, upcoming, J) {
  const l = label(x);
  const badge = x.status === 'live' ? '<span class="badge bad">Live</span>' : x.status === 'closed' ? '<span class="badge ok">Closed</span>' : '<span class="badge">Upcoming</span>';
  let h = `<div style="border-top:3px solid #000;padding-top:10px;margin-top:10px"><div class="row"><b class="grow">${esc(l.sub)}</b>${badge}</div>`;
  if (x.status === 'live') {
    h += `<p class="sub">Judges in: ${Array.from({ length: J }, (_, i) => `Judge ${i + 1} ${judgeDone(x, i + 1) ? '✅' : '⏳'}`).join(', ')}</p>`;
  }
  if (x.status === 'closed') {
    const r = ranking(x);
    h += r.map((y, i) => { const s = sById(y.id); return `<div class="item"><div class="rank">${i + 1}</div><div class="grow"><b>${esc(costumeOf(s))}</b><span>${y.avg != null ? 'Avg ' + y.avg : 'No scores'}${!x.final && i < adv(x) ? ', advances' : ''}</span></div>
      <button class="sm alt" data-act="mv" data-h="${esc(x.id)}" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
      <button class="sm alt" data-act="mv" data-h="${esc(x.id)}" data-i="${i}" data-dir="1" ${i === r.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></div>`; }).join('');
    if (r.ties) h += '<div class="note err"><b>Tie.</b> Use the arrows to set the order, or reopen the heat for a re-surf.</div>';
  } else {
    const others = upcoming.filter(u => u.id !== x.id && u.division === x.division);
    h += x.surfers.map(id => { const s = sById(id); return `<div class="item"><div class="grow"><b>${esc(costumeOf(s))}</b><span>${esc(s ? s.name : '')}</span></div>
      ${x.status === 'upcoming' ? `<select data-chg="move" data-s="${esc(id)}" data-from="${esc(x.id)}"><option value="">Move...</option>${others.map(u => `<option value="${esc(u.id)}">${esc(label(u).sub)}</option>`).join('')}<option value="-">Remove from heat</option></select>` : ''}</div>`; }).join('');
  }
  h += '<div class="row" style="margin-top:8px">';
  if (x.status === 'upcoming') h += `<button class="grow" data-act="start" data-h="${esc(x.id)}">Start heat</button><button class="alt" data-act="delheat" data-h="${esc(x.id)}">Delete</button>`;
  if (x.status === 'live') h += `<button class="grow danger" data-act="close" data-h="${esc(x.id)}">Close heat</button>`;
  if (x.status === 'closed') h += `<button class="alt sm" data-act="reopen" data-h="${esc(x.id)}">Reopen heat</button>`;
  return h + '</div></div>';
}

// ---------- Actions ----------
async function genRound(d) {
  const hs = heatsOf(d);
  const last = hs.length ? Math.max(...hs.map(x => x.round)) : 0;
  let pool;
  if (!last) pool = S.surfers.filter(s => s.division === d).map(s => s.id);
  else {
    const lh = hs.filter(x => x.round === last);
    if (lh.some(x => ranking(x).ties) && !confirm('There is an unresolved tie in the last round. Make the next round anyway?')) return;
    pool = lh.flatMap(x => ranking(x).slice(0, adv(x)).map(r => r.id));
  }
  if (pool.length < 3 && !confirm(d + ' has only ' + pool.length + ' surfers, so it cannot award a full podium. Continue? (You can merge divisions in Settings.)')) return;
  shuffle(pool);
  const final = pool.length <= 4, k = final ? 1 : Math.ceil(pool.length / 4);
  const groups = Array.from({ length: k }, () => []);
  pool.forEach((id, i) => groups[i % k].push(id));
  const ops = groups.map((g, i) => ({ t: 'upsert', tab: 'Heats', row: { id: uid('h'), division: d, round: last + 1, num: i + 1, final, surfers: g.join(','), status: 'upcoming', startedAt: '', override: '' } }));
  await act(() => call(ops), 'Heats ready');
}
const heatById = id => S.heats.find(x => x.id === id);
const setHeat = (id, fields) => ({ t: 'upsert', tab: 'Heats', row: Object.assign({ id }, fields) });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'tab') { adminTab = d.tab; lsSet('adminTab', adminTab); render(); }
  else if (a === 'save') saveSurfer();
  else if (a === 'cancel') { formReset(); closeSheet(); }
  else if (a === 'add') { formReset(); openSheet(true); }
  else if (a === 'edit') formEdit(d.id);
  else if (a === 'delsurfer') { const id = $('#f-id').value; if (id && confirm('Delete this entry?')) act(async () => { await call([{ t: 'delete', tab: 'Surfers', id }]); formReset(); closeSheet(); }, 'Entry deleted'); }
  else if (a === 'paid') { const s = sById(d.id); act(() => call([{ t: 'upsert', tab: 'Surfers', row: { id: d.id, paid: !s.paid } }]), s.paid ? 'Marked unpaid' : 'Marked paid'); }
  else if (a === 'gen') genRound(d.d);
  else if (a === 'start') {
    if (liveHeat() && !confirm('Another heat is still live. Start this one anyway?')) return;
    buzz(40); act(() => call([setHeat(d.h, { status: 'live', startedAt: Date.now() })]), 'Heat started');
  }
  else if (a === 'close') { if (confirm('Close this heat? Judges can no longer change scores.')) act(() => call([setHeat(d.h, { status: 'closed' })]), 'Heat closed'); }
  else if (a === 'reopen') act(() => call([setHeat(d.h, { status: 'live', override: '' })]), 'Heat reopened');
  else if (a === 'delheat') { if (confirm('Delete this heat? Its surfers go back to unassigned.')) act(() => call([{ t: 'delete', tab: 'Heats', id: d.h }]), 'Heat deleted'); }
  else if (a === 'mv') {
    const hh = heatById(d.h), order = ranking(hh).map(r => r.id), i = Number(d.i), j = i + Number(d.dir);
    [order[i], order[j]] = [order[j], order[i]];
    act(() => call([setHeat(d.h, { override: order.join(',') })]));
  }
  else if (a === 'merge') {
    const from = $('#m-from').value, to = $('#m-to').value;
    if (from === to) return;
    if (heatsOf(from).length || heatsOf(to).length) return alert('Delete the existing heats for both divisions first, then merge.');
    if (confirm('Move everyone in ' + from + ' into ' + to + '?'))
      act(() => call(S.surfers.filter(s => s.division === from).map(s => ({ t: 'upsert', tab: 'Surfers', row: { id: s.id, division: to } }))));
  }
  else if (a === 'judge') { lsSet('judge', Number(d.n)); renderJudge(); }
  else if (a === 'step') {
    const dr = ls('draft', {}), cur = dr[d.k];
    dr[d.k] = cur == null ? 5 : Math.max(0, Math.min(10, cur + Number(d.d)));
    lsSet('draft', dr); buzz(10); renderJudge();
  }
  else if (a === 'submit') {
    const live = liveHeat(), me = ls('judge', 0), dr = ls('draft', {});
    if (!live || !me) return;
    const ops = live.surfers.map(id => { const k = live.id + '|' + me + '|' + id; return { t: 'upsert', tab: 'Scores', row: { id: k, heatId: live.id, judge: me, surferId: id, value: dr[k] } }; });
    enqueue(ops); buzz(40); toast('Scores submitted'); renderJudge();
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-age' ) { /* handled on input */ }
  if (el.id === 'f-div') { divTouched = true; syncCC(); }
  const c = el.dataset && el.dataset.chg; if (!c) return;
  if (c === 'judges') act(() => call([{ t: 'upsert', tab: 'Config', row: { id: 'judges', value: Number(el.value) } }]));
  else if (c === 'winner') act(() => call([{ t: 'upsert', tab: 'Config', row: { id: el.dataset.k, value: el.value } }]));
  else if (c === 'move' || c === 'assign') {
    if (!el.value) return;
    const sid = el.dataset.s, ops = [];
    if (c === 'move') { const from = heatById(el.dataset.from); ops.push(setHeat(from.id, { surfers: from.surfers.filter(x => x !== sid).join(','), override: '' })); }
    if (el.value !== '-') { const to = heatById(el.value); ops.push(setHeat(to.id, { surfers: to.surfers.concat(sid).join(','), override: '' })); }
    act(() => call(ops));
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-age' && !divTouched) {
    const a = e.target.value;
    if (a !== '') { $('#f-div').value = suggestDiv(Number(a)); syncCC(); }
  }
});

// ---------- Boot ----------
async function ensurePin() {
  if (!API_URL) return true;
  if (!ls('pin', '')) { const p = prompt('Admin PIN'); if (!p) return false; lsSet('pin', p); }
  try { await call([{ t: 'ping' }]); return true; }
  catch (e) {
    if (/PIN/.test(e.message)) { localStorage.removeItem('sc_pin'); alert('Wrong PIN.'); }
    else alert('Could not reach the server. Check your signal.');
    return false;
  }
}
async function route() {
  closeSheet();
  if (view() === 'admin' && !(await ensurePin())) { location.hash = '#board'; return; }
  render();
}
window.addEventListener('hashchange', route);
window.addEventListener('online', () => { flush(); poll(); });
if (!API_URL) $('#demo').style.display = '';
refreshDivSelect(); formReset();
route(); poll(); flush();
setInterval(poll, 4000);
setInterval(flush, 6000);
</script>
